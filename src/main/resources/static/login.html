<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <title>Apache Artemis Benchmark Tool - Login</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e1e; color: #eee; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: #2d2d2d; padding: 40px; border-radius: 8px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; }
        h1 { color: #4CAF50; margin-top: 0; margin-bottom: 30px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; background: #1a1a1a; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; font-size: 1em; }
        button { background: #4CAF50; color: white; padding: 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 1.1em; width: 100%; font-weight: bold; }
        button:hover { opacity: 0.9; }
        .error { color: #f44336; margin-bottom: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🚀 Apache Artemis Benchmark Tool</h1>
        
        <script>
            if (window.location.search.includes('error')) {
                document.write('<div class="error">Ongeldige inloggegevens. Probeer het opnieuw.</div>');
            }
        </script>

        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Gebruikersnaam" required autofocus>
            <input type="password" name="password" placeholder="Wachtwoord" required>
            <button type="submit">Inloggen</button>
        </form>
    </div>
</body>
</html>
